<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rechercher un film - Le Ciné du Village</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <h1 class="site-logo"><a href="index.html"><span class="logo-icon">🎬</span> Le Ciné du Village</a></h1>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="search.html">Rechercher un film</a>
      </nav>
    </header>

    <main>
      <h2>Rechercher un film</h2>
      <label for="search-input">Nom du film :</label>
      <input id="search-input" type="search" placeholder="Exemple : Transformers" autocomplete="off">
      <p id="search-message" aria-live="polite">Tape au moins deux lettres pour commencer.</p>
      <section id="search-results" class="movie-list"></section>
      <button id="load-more" type="button" hidden>Charger plus de résultats</button>
    </main>
    <script type="module" src="js/search.js"></script>
  </body>
</html>
