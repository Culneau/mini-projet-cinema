<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détails du film - Le Ciné du Village</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/movie.js"></script>
  </head>
  <body class="movie-page">
    <header>
      <h1 class="site-logo"><a href="index.html"><span class="logo-icon">🎬</span> Le Ciné du Village</a></h1>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="search.html">Rechercher un film</a>
      </nav>
    </header>

    <main>
      <p><a href="index.html">← Retour aux films</a></p>
      <p id="movie-message">Chargement du film...</p>
      <article id="movie-details" class="movie-details" hidden>
        <div id="movie-poster-placeholder" class="poster-placeholder">Chargement de l’affiche...</div>
        <img id="movie-poster" alt="Affiche du film" hidden>
        <div class="movie-info">
          <h2 id="movie-title"></h2>
          <p><strong>Année :</strong> <span id="movie-year"></span></p>
          <p><strong>Genre :</strong> <span id="movie-genre"></span></p>
          <p><strong>Acteurs :</strong> <span id="movie-actors"></span></p>
          <p><strong>Sortie DVD :</strong> <span id="movie-dvd"></span></p>
          <h3>Résumé</h3>
          <p id="movie-plot"></p>
          <h3>Notes</h3>
          <ul id="movie-ratings"></ul>
        </div>
      </article>
    </main>
  </body>
</html>
